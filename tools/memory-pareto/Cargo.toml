[package]
name = "tree-sitter-memory-pareto"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.102"
libloading = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
signal-hook = "0.4.4"
tree-sitter = { path = "../../lib" }
tree-sitter-language = { path = "../../crates/language" }

[[bin]]
name = "tree-sitter-memory-pareto"
path = "main.rs"
